name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages 要先列本次运行的 github-pages 产物再发布。
  # 显式写 permissions 时未列出的权限一律为 none —— 少了 actions: read，
  # 产物明明上传成功（24.8 MB，名字对、没过期），它仍报
  # 「No artifacts named "github-pages" were found for this workflow run」。
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 2026-11-24 升版：原来 checkout@v4 / configure-pages@v5 /
      # upload-pages-artifact@v3 / deploy-pages@v4 全是 Node 20 时代的版本，
      # 被 runner 强制跑在 Node 24 上，deploy-pages 会报
      # 「No artifacts named "github-pages" were found for this workflow run」
      # （产物明明上传成功，只是元数据 API 对不上）。
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      # 2026-11-24：产物上传成功（API 里能查到 github-pages，24.8 MB、未过期），
      # 但紧接着的 deploy-pages 查元数据返回空 —— 索引有写入延迟。
      # 这里留一段缓冲，别让发布跑在索引前面。
      - name: 等产物索引就绪
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v5
